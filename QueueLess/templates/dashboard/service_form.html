<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | QueueLess</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button,
        a {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #222;
            color: white;
        }

        a {
            background: #777;
            color: white;
            margin-left: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>{{ title }}</h1>

        <form method="POST">

            {% csrf_token %}

            <label for="name">
                Service Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ service.name|default:'' }}"
                required
            >

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                required
            >{{ service.description|default:'' }}</textarea>

            <label for="average_service_time">
                Average Service Time (minutes)
            </label>

            <input
                type="number"
                id="average_service_time"
                name="average_service_time"
                min="1"
                value="{{ service.average_service_time|default:'5' }}"
                required
            >

            <button type="submit">
                {{ button_text }}
            </button>

            <a href="{% url 'admin_dashboard' %}">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
