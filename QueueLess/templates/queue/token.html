<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Token | QueueLess</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .token-number {
            font-size: 64px;
            font-weight: bold;
            margin: 30px 0;
        }

        .service {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin: 5px;
        }

        .button:hover {
            background: #444;
        }

        .secondary {
            background: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>QueueLess</h1>

        <p class="subtitle">
            Your token has been generated successfully.
        </p>

        <div class="token-number">
            #{{ token.token_number }}
        </div>

        <div class="service">
            Service: <strong>{{ token.service.name }}</strong>
        </div>

        <a
            href="{% url 'token_status' token.id %}"
            class="button"
        >
            View Live Status
        </a>

        <a
            href="{% url 'services' %}"
            class="button secondary"
        >
            Get Another Token
        </a>

        <br><br>

        <a href="{% url 'history' %}">
            View Token History
        </a>

    </div>

</div>

</body>
</html>
